name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  ci:
    name: Backend tests + Frontend typecheck & build
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: app/package.json

      - name: Install Linux Tauri & Python System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0 libraw-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libxdo-dev patchelf

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r backend/requirements.txt

      - name: Run Backend Security & Regression Tests
        run: |
          python test_security_hardening.py

      - name: Typecheck & Build Frontend
        run: |
          cd app
          npm ci && npm run typecheck && npm run build

      - name: Check Tauri Rust Shell
        run: |
          mkdir -p app/python-backend
          cargo check --manifest-path app/src-tauri/Cargo.toml
