name: Build & Publish Release Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build ${{ matrix.target_os }} (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target_os: macOS
            platform: mac
            arch: arm64
            builder_flags: "--mac --arm64"
          - os: windows-latest
            target_os: Windows
            platform: win
            arch: x64
            builder_flags: "--win --x64"
          - os: ubuntu-22.04
            target_os: Linux
            platform: linux
            arch: x64
            builder_flags: "--linux AppImage deb"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-glx libglib2.0-0 libraw-dev libfuse2

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pyinstaller

      - name: Pre-download ML Models
        run: |
          python backend/download_models.py

      - name: Build Standalone Python Backend
        run: |
          pyinstaller build/photo-culler.spec --distpath app/python-backend --noconfirm

      - name: Verify Python Backend Binary
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            ls -la app/python-backend/photo-culler-backend/photo-culler-backend.exe
            cp app/python-backend/photo-culler-backend/photo-culler-backend.exe app/python-backend/
            cp -R app/python-backend/photo-culler-backend/_internal app/python-backend/
          else
            ls -la app/python-backend/photo-culler-backend/photo-culler-backend
            cp app/python-backend/photo-culler-backend/photo-culler-backend app/python-backend/
            cp -R app/python-backend/photo-culler-backend/_internal app/python-backend/
            chmod +x app/python-backend/photo-culler-backend
          fi

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: app/package.json

      - name: Install Electron Frontend Dependencies
        run: |
          cd app
          npm install

      - name: Build Electron App
        run: |
          cd app
          npm run build

      - name: Package with Electron Builder
        run: |
          cd app
          npx electron-builder ${{ matrix.builder_flags }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Release Artifacts
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_name || inputs.release_tag }}
          name: FirstPass ${{ github.ref_name || inputs.release_tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            app/dist/*.dmg
            app/dist/*.exe
            app/dist/*.AppImage
            app/dist/*.deb
            app/dist/*.zip
            app/dist/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
