name: Build & Publish Release Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build ${{ matrix.target_os }} (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target_os: macOS
            platform: mac
            arch: arm64
            builder_flags: "--mac --arm64"
          - os: windows-latest
            target_os: Windows
            platform: win
            arch: x64
            builder_flags: "--win --x64"
          - os: ubuntu-22.04
            target_os: Linux
            platform: linux
            arch: x64
            builder_flags: "--linux"

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0 libraw-dev libfuse2 fakeroot dpkg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ "${{ runner.os }}" = "Linux" ]; then
            pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          fi
          pip install -r backend/requirements.txt
          pip install pyinstaller

      - name: Pre-download ML Models
        run: |
          python backend/download_models.py

      - name: Build Standalone Python Backend
        run: |
          pyinstaller --distpath app/python-backend-dist --workpath build/pyinstaller-work --clean --noconfirm build/photo-culler.spec

      - name: Stage & Verify Python Backend Binary
        run: |
          echo "=== Locating built backend ==="
          BACKEND_SRC=""
          for candidate in \
            "app/python-backend-dist/photo-culler-backend" \
            "dist/photo-culler-backend" \
            "app/python-backend/photo-culler-backend"; do
            if [ -d "$candidate" ]; then
              BACKEND_SRC="$candidate"
              break
            fi
          done

          if [ -z "$BACKEND_SRC" ]; then
            echo "ERROR: Could not locate built backend directory!"
            echo "Directory tree:"
            find . -maxdepth 3 -ls
            exit 1
          fi

          echo "Found backend files at: $BACKEND_SRC"
          mkdir -p app/python-backend
          cp -R "$BACKEND_SRC"/* app/python-backend/

          if [ "${{ runner.os }}" = "Windows" ]; then
            if [ ! -f "app/python-backend/photo-culler-backend.exe" ]; then
              echo "ERROR: photo-culler-backend.exe not found in app/python-backend!"
              ls -la app/python-backend
              exit 1
            fi
            echo "Windows backend verified: app/python-backend/photo-culler-backend.exe"
          else
            if [ ! -f "app/python-backend/photo-culler-backend" ]; then
              echo "ERROR: photo-culler-backend not found in app/python-backend!"
              ls -la app/python-backend
              exit 1
            fi
            chmod +x app/python-backend/photo-culler-backend
            echo "Unix backend verified: app/python-backend/photo-culler-backend"
          fi
          ls -la app/python-backend

      - name: Clean Build Caches to Free Disk Space
        run: |
          rm -rf app/python-backend-dist build/pyinstaller-work dist ~/.cache/pip

      - name: Setup Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: app/package.json

      - name: Install Electron Frontend Dependencies
        run: |
          cd app
          npm install

      - name: Build Electron App
        run: |
          cd app
          npm run build

      - name: Package with Electron Builder
        run: |
          cd app
          npx electron-builder ${{ matrix.builder_flags }} --publish never
        env:
          DEBUG: electron-builder*
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Release Artifacts
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_name || inputs.release_tag }}
          name: FirstPass ${{ github.ref_name || inputs.release_tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          make_latest: true
          fail_on_unmatched_files: false
          files: |
            app/dist/*.dmg
            app/dist/*.exe
            app/dist/*.AppImage
            app/dist/*.deb
            app/dist/*.zip
            app/dist/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
