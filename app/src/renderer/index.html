<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>FirstPass</title>
    <!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: http://localhost:58765; connect-src 'self' http://localhost:58765;"
    />
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #090d14;
        color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        overflow: hidden;
      }
      .fp-preloader {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 100vw;
        height: 100vh;
        background-color: #090d14;
        user-select: none;
      }
      @keyframes fpApertureBreathePre {
        0% { transform: rotate(0deg) scale(0.96); }
        50% { transform: rotate(30deg) scale(1.04); }
        100% { transform: rotate(0deg) scale(0.96); }
      }
      @keyframes fpCheckPulsePre {
        0%, 100% {
          filter: drop-shadow(0 0 3px #10B981) drop-shadow(0 0 10px rgba(16, 185, 129, 0.5));
          stroke-width: 6.8px;
        }
        50% {
          filter: drop-shadow(0 0 7px #4ade80) drop-shadow(0 0 18px rgba(74, 222, 128, 0.9));
          stroke-width: 7.6px;
        }
      }
      @keyframes fpDotBounce {
        0%, 80%, 100% { transform: scale(0); opacity: 0.3; }
        40% { transform: scale(1); opacity: 1; }
      }
      .fp-dot {
        display: inline-block;
        width: 4px;
        height: 4px;
        margin: 0 1.5px;
        background-color: #34d399;
        border-radius: 50%;
        animation: fpDotBounce 1.4s infinite ease-in-out both;
      }
      .fp-dot:nth-child(1) { animation-delay: -0.32s; }
      .fp-dot:nth-child(2) { animation-delay: -0.16s; }
      .fp-dot:nth-child(3) { animation-delay: 0s; }
    </style>
  </head>
  <body class="bg-background text-white h-screen w-screen overflow-hidden m-0 p-0 select-none">
    <div id="root" class="h-full w-full">
      <div class="fp-preloader">
        <div style="position: relative; width: 96px; height: 96px; display: flex; align-items: center; justify-content: center;">
          <!-- Ambient Glow -->
          <div style="position: absolute; inset: 0; border-radius: 9999px; filter: blur(20px); pointer-events: none; opacity: 0.45; background: radial-gradient(circle, rgba(16,185,129,0.45) 0%, rgba(16,185,129,0) 70%);"></div>
          
          <svg viewBox="0 0 100 100" style="width: 100%; height: 100%; position: relative; z-index: 10; overflow: visible; filter: drop-shadow(0 20px 25px rgba(0,0,0,0.6));">
            <defs>
              <linearGradient id="preOuterRim" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#94a3b8" />
                <stop offset="25%" stop-color="#64748b" />
                <stop offset="65%" stop-color="#334155" />
                <stop offset="100%" stop-color="#1e293b" />
              </linearGradient>
              <linearGradient id="preBladeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#3b4656" />
                <stop offset="50%" stop-color="#28303d" />
                <stop offset="100%" stop-color="#181d26" />
              </linearGradient>
              <linearGradient id="preBladeStroke" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#94a3b8" />
                <stop offset="50%" stop-color="#64748b" />
                <stop offset="100%" stop-color="#475569" />
              </linearGradient>
              <linearGradient id="preEmeraldCheck" x1="0%" y1="100%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#059669" />
                <stop offset="35%" stop-color="#10B981" />
                <stop offset="100%" stop-color="#4ade80" />
              </linearGradient>
              <filter id="preGlow" x="-30%" y="-30%" width="160%" height="160%">
                <feGaussianBlur stdDeviation="2.5" result="blur" />
                <feMerge>
                  <feMergeNode in="blur" />
                  <feMergeNode in="SourceGraphic" />
                </feMerge>
              </filter>
            </defs>

            <!-- Outer Housing Rim -->
            <circle cx="50" cy="50" r="45" fill="#10141b" stroke="url(#preOuterRim)" stroke-width="3.2" />
            <circle cx="50" cy="50" r="42" fill="none" stroke="#0f172a" stroke-width="1.2" />

            <!-- Rotating Aperture Iris Assembly -->
            <g style="transform-origin: 50px 50px; animation: fpApertureBreathePre 3.6s ease-in-out infinite;">
              <circle cx="50" cy="50" r="18" fill="#07090d" stroke="#334155" stroke-width="1" />
              <!-- 6 Blades with defined high-definition chamfer outlines -->
              <g transform="rotate(0 50 50)"><path d="M 50 10 A 40 40 0 0 1 84.64 30 L 62 48 A 16 16 0 0 0 50 34 Z" fill="url(#preBladeGrad)" stroke="url(#preBladeStroke)" stroke-width="1.8" stroke-linejoin="round" /></g>
              <g transform="rotate(60 50 50)"><path d="M 50 10 A 40 40 0 0 1 84.64 30 L 62 48 A 16 16 0 0 0 50 34 Z" fill="url(#preBladeGrad)" stroke="url(#preBladeStroke)" stroke-width="1.8" stroke-linejoin="round" /></g>
              <g transform="rotate(120 50 50)"><path d="M 50 10 A 40 40 0 0 1 84.64 30 L 62 48 A 16 16 0 0 0 50 34 Z" fill="url(#preBladeGrad)" stroke="url(#preBladeStroke)" stroke-width="1.8" stroke-linejoin="round" /></g>
              <g transform="rotate(180 50 50)"><path d="M 50 10 A 40 40 0 0 1 84.64 30 L 62 48 A 16 16 0 0 0 50 34 Z" fill="url(#preBladeGrad)" stroke="url(#preBladeStroke)" stroke-width="1.8" stroke-linejoin="round" /></g>
              <g transform="rotate(240 50 50)"><path d="M 50 10 A 40 40 0 0 1 84.64 30 L 62 48 A 16 16 0 0 0 50 34 Z" fill="url(#preBladeGrad)" stroke="url(#preBladeStroke)" stroke-width="1.8" stroke-linejoin="round" /></g>
              <g transform="rotate(300 50 50)"><path d="M 50 10 A 40 40 0 0 1 84.64 30 L 62 48 A 16 16 0 0 0 50 34 Z" fill="url(#preBladeGrad)" stroke="url(#preBladeStroke)" stroke-width="1.8" stroke-linejoin="round" /></g>
              <circle cx="50" cy="50" r="6" fill="#10B981" opacity="0.45" />
            </g>

            <!-- Luminous Emerald Checkmark -->
            <g filter="url(#preGlow)">
              <path d="M 46 64 L 60 78 L 86 44" fill="none" stroke="#022c22" stroke-width="9.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.8" />
              <path d="M 46 64 L 60 78 L 86 44" fill="none" stroke="url(#preEmeraldCheck)" stroke-width="6.8" stroke-linecap="round" stroke-linejoin="round" style="animation: fpCheckPulsePre 3.6s ease-in-out infinite;" />
            </g>
          </svg>
        </div>

        <div style="margin-top: 24px; text-align: center;">
          <div style="font-size: 22px; font-weight: 700; letter-spacing: -0.02em; color: #ffffff; display: flex; align-items: center; justify-content: center; gap: 3px;">
            First<span style="color: #34d399; font-weight: 800;">Pass</span>
          </div>
          <div style="margin-top: 8px; font-size: 13px; color: #94a3b8; font-weight: 500; letter-spacing: 0.02em; display: flex; align-items: center; justify-content: center; gap: 6px;">
            <span>Launching FirstPass</span>
            <span style="display: inline-flex; align-items: center;">
              <span class="fp-dot"></span>
              <span class="fp-dot"></span>
              <span class="fp-dot"></span>
            </span>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
